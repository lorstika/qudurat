    panel.innerHTML=`<div class="row between"><h2>سجل الدرجات</h2><button class="ghost" id="export">تنزيل CSV</button></div><div class="card">${grades.length?`<div class="table-wrap"><table><thead><tr><th>الطالب</th><th>الاختبار</th><th>الحالة</th><th>الدرجة</th><th>النتيجة</th><th>إجراء</th></tr></thead><tbody>${grades.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.title)}</td><td>${g.submitted?'تم التسليم':g.attempt_id?'جارٍ الحل':g.due&&g.due<Date.now()?'انتهى الموعد':'لم يبدأ'}</td><td>${g.submitted?(g.score===null?'بانتظار التصحيح':`${g.score} / ${g.max_score}`):'—'}</td><td>${g.released?'منشورة':'محجوبة'}</td><td>${g.submitted?`<button class="ghost small" data-review="${g.attempt_id}">مراجعة</button> <button class="small ${g.released?'ghost':''}" data-release="${g.assignment_id}" ${!g.released&&g.score===null?'disabled':''}>${g.released?'سحب النتيجة':'نشر النتيجة'}</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('كلّف الطلاب باختبار ليبدأ سجل الدرجات.')}</div>`;
    $('#export').onclick=exportGrades;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review));document.querySelectorAll('[data-release]').forEach(b=>b.onclick=async()=>{const g=grades.find(g=>g.assignment_id===b.dataset.release);try{await api('release','POST',{assignmentId:g.assignment_id,released:!g.released});notify(g.released?'تم سحب النتيجة':'تم نشر النتيجة للطالب');dashboard();}catch(e){notify(e.message);}});
  }
  if(tab==='settings'){
    panel.innerHTML=`<div class="grid two"><section class="card"><h2>كلمة دخول الموقع الأسبوعية</h2><span class="badge ${access.active?'ok':'warn'}">${access.active?'سارية':'غير سارية'}</span><p class="muted">${access.expires?'تنتهي: '+date(access.expires):'لم تُنشأ كلمة دخول بعد.'}</p><p class="help">تعمل لمدة ٧ أيام. تُعرض الكلمة الجديدة مرة واحدة لتشاركها مع طلابك. التجديد يلغي الكلمة السابقة وجلسات الطلاب فورًا؛ وقت الاختبار يستمر.</p><button id="renew">توليد كلمة أسبوع جديد</button><div id="newCode"></div></section><section class="card"><h2>تسجيل الطلاب</h2><p class="muted">الطلاب يسجلون أسماءهم وحساباتهم باستخدام كلمة الأسبوع.</p><button id="registration" class="ghost">${access.registration?'إيقاف التسجيل الجديد':'فتح التسجيل الجديد'}</button><p class="help">إيقاف التسجيل لا يوقف حسابات الطلاب الموجودين.</p><hr><h3>روابط البوابة</h3><p><a href="./portal.html">دخول الطلاب</a> · <a href="./portal.html?view=teacher">دخول المعلم</a></p><p class="help">كلمة حساب الإدارة تتغير من زر «كلمة المرور» أعلى الصفحة.</p></section></div>`;
    $('#renew').onclick=async()=>{if(!confirm('تجديد كلمة الموقع لمدة ٧ أيام؟ سيسجل الطلاب الدخول مجددًا. تجنب ذلك أثناء اختبار نشط.'))return;try{const r=await api('access','POST',{renew:true});access={...access,expires:r.expires,active:true};$('#newCode').innerHTML=`<label>انسخ الكلمة الآن واحتفظ بها في مكان آمن</label><output class="code">${esc(r.code)}</output><p class="help">صالحة حتى ${date(r.expires)}. لن تُعرض مجددًا؛ يمكنك توليد بديلة عند فقدها.</p>`;notify('تم تجديد كلمة الموقع');}catch(e){notify(e.message);}};
    $('#registration').onclick=async()=>{try{await api('access','POST',{registration:!access.registration});dashboard();}catch(e){notify(e.message);}};
  }
}
function dialog(html){$('dialog')?.remove();const d=document.createElement('dialog');d.innerHTML=`<div class="row between"><span class="eyebrow">مِران / إدارة</span><button class="small ghost" id="closeDialog">إغلاق</button></div>${html}`;document.body.append(d);$('#closeDialog').onclick=()=>d.close();d.showModal();return d;}
function addStudent(){const d=dialog(`<h2>إضافة طالب</h2><form id="addStudentForm">${field('الاسم','name')}${field('اسم المستخدم','username','text','dir="ltr" pattern="[a-zA-Z0-9._-]{3,40}"')}${field('كلمة مرور مؤقتة (١٢ حرفًا على الأقل)','password','password','minlength="12" autocomplete="new-password"')}<p class="error"></p><button type="submit">إنشاء الحساب</button></form>`);wireForm('#addStudentForm',async b=>{await api('students','POST',b);d.close();notify('تم إنشاء الحساب');dashboard();});}
function resetPassword(uid){const d=dialog(`<h2>إعادة تعيين كلمة المرور</h2><p class="help">أعطِ الطالب كلمة المرور الجديدة بشكل خاص. سيُطلب منه تغييرها.</p><form id="resetForm">${field('كلمة مرور مؤقتة','password','password','minlength="12" maxlength="128" autocomplete="new-password"')}<p class="error"></p><button type="submit">إعادة التعيين</button></form>`);wireForm('#resetForm',async b=>{await api('students/'+uid,'PATCH',b);d.close();notify('تمت إعادة التعيين');});}
function examEditor(source){
  if(source instanceof Event)source=null;
  let questions=source?structuredClone(source.questions):[{type:'mcq',stem:'',points:1,options:['','','',''],correct:0}];
  app.innerHTML=`<div class="intro"><div class="eyebrow">مِران / إنشاء اختبار</div><h1>${source?'نسخة جديدة من الاختبار':'اختبار بخطوات بسيطة'}</h1><p>اكتب الأسئلة، حدّد الدرجات، ثم احفظ نسخة جاهزة لتكليف الطلاب.</p></div><form id="examForm"><div class="card">${field('عنوان الاختبار','title','text','maxlength="120"')}${field('المدة بالدقائق','minutes','number','min="1" max="240" value="30"')}</div><div id="questions"></div><div class="actions"><button type="button" class="ghost" id="addMcq">+ اختيار من متعدد</button><button type="button" class="ghost" id="addWritten">+ إجابة مكتوبة</button></div><p class="error" role="alert"></p><div class="actions"><button type="submit">حفظ الاختبار</button><button type="button" class="ghost" id="cancelExam">رجوع</button></div></form>`;
  $('#title').value=source?source.title+' (نسخة)':'';$('#minutes').value=source?.minutes||30;
  function draw(){
    $('#questions').innerHTML=questions.map((q,i)=>`<section class="qedit" data-q="${i}"><div class="qhead"><h3>السؤال ${i+1} · ${q.type==='mcq'?'اختيار من متعدد':'إجابة مكتوبة'}</h3><button type="button" class="ghost small" data-remove="${i}">حذف</button></div><label for="stem${i}">نص السؤال</label><textarea id="stem${i}" data-key="stem" maxlength="4000" required>${esc(q.stem)}</textarea><label for="points${i}">درجة السؤال</label><input id="points${i}" data-key="points" type="number" value="${q.points}" min="1" max="100" required>${q.type==='mcq'?q.options.map((o,k)=>`<label for="opt${i}_${k}">الخيار ${['أ','ب','ج','د'][k]}</label><input id="opt${i}_${k}" data-option="${k}" value="${esc(o)}" maxlength="1000" required>`).join('')+`<label for="correct${i}">الإجابة الصحيحة</label><select id="correct${i}" data-key="correct">${['أ','ب','ج','د'].map((l,k)=>`<option value="${k}" ${q.correct===k?'selected':''}>${l}</option>`).join('')}</select>`:'<p class="help">تُصحّح هذه الإجابة يدويًا قبل نشر النتيجة.</p>'}</section>`).join('');
    document.querySelectorAll('[data-q]').forEach(node=>{const q=questions[+node.dataset.q];node.oninput=e=>{if(e.target.dataset.option!==undefined)q.options[+e.target.dataset.option]=e.target.value;else if(e.target.dataset.key)q[e.target.dataset.key]=['points','correct'].includes(e.target.dataset.key)?+e.target.value:e.target.value;};});
    document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{questions.splice(+b.dataset.remove,1);draw();});
  }
  draw();$('#addMcq').onclick=()=>{questions.push({type:'mcq',stem:'',points:1,options:['','','',''],correct:0});draw();};$('#addWritten').onclick=()=>{questions.push({type:'written',stem:'',points:5});draw();};$('#cancelExam').onclick=dashboard;
  wireForm('#examForm',async b=>{await api('exams','POST',{title:b.title,minutes:+b.minutes,questions});tab='exams';notify('تم حفظ الاختبار. يمكنك الآن تكليف الطلاب');dashboard();});
}
function assignForm(examId){
  const available=students.filter(s=>s.active&&s.approved&&!assignments.some(a=>a.exam_id===examId&&a.user_id===s.id));
  const d=dialog(`<h2>تكليف الطلاب</h2><p>${esc(exams.find(e=>e.id===examId).title)}</p>${available.length?`<form id="assignForm"><label class="check"><input type="checkbox" id="selectAll"> اختيار الجميع</label>${available.map(s=>`<label class="check"><input type="checkbox" name="student" value="${s.id}">${esc(s.name)} <span class="muted">${esc(s.username)}</span></label>`).join('')}<label for="due">موعد إغلاق اختياري (بتوقيت جهازك)</label><input id="due" type="datetime-local" name="due"><p class="help">يصبح الاختبار متاحًا فور التكليف. محاولة واحدة؛ ينتهي عند انتهاء مدته أو موعد الإغلاق، أيهما أقرب.</p><p class="error"></p><button type="submit">تكليف الطلاب المحددين</button></form>`:empty('جميع الطلاب النشطين مكلفون بهذا الاختبار، أو لا يوجد طلاب نشطون.')}`);
  if(!available.length)return;$('#selectAll').onchange=e=>document.querySelectorAll('[name=student]').forEach(c=>c.checked=e.target.checked);
  wireForm('#assignForm',async(b,f)=>{const ids=[...f.querySelectorAll('[name=student]:checked')].map(c=>c.value);await api('assign','POST',{examId,studentIds:ids,due:b.due?new Date(b.due).getTime():null});d.close();notify('تم التكليف');dashboard();});
}
function studentView(){
  const completed=assignments.filter(a=>a.submitted),pending=assignments.filter(a=>!a.submitted&&(!a.due||a.due>Date.now()));
  app.innerHTML=`<div class="intro"><div class="eyebrow">مِران / مساحة الطالب</div><h1>أهلًا ${esc(user.name)}،<br><span class="hl">لنبدأ خطوة جديدة.</span></h1><p>هذه اختباراتك المكلّف بها. يمكنك متابعة محاولتك قبل انتهاء الوقت، وتظهر نتيجتك بعد نشرها من المعلم.</p><a class="button ghost" href="./index.html">الذهاب إلى التدريب</a></div><div class="grid"><div class="card metric"><strong>${pending.length}</strong><p>اختبار بانتظارك</p></div><div class="card metric"><strong>${completed.length}</strong><p>اختبار تم تسليمه</p></div><div class="card metric"><strong>${assignments.filter(a=>a.released).length}</strong><p>نتيجة منشورة</p></div></div><h2>اختباراتي</h2>${assignments.length?assignments.map(a=>{const closed=a.due&&a.due<=Date.now(),status=a.submitted?(a.released?'نتيجتك جاهزة':'بانتظار نشر النتيجة'):closed?'انتهى الموعد':a.attempt_id?'محاولة جارية':'جاهز للبدء';return `<article class="card"><div class="row between"><h2>${esc(a.title)}</h2><span class="badge ${a.released?'ok':''}">${status}</span></div><p class="muted">${a.minutes} دقيقة · محاولة واحدة · ${a.due?'الإغلاق: '+date(a.due):'دون موعد إغلاق'}</p>${a.released?`<p class="score">${a.score} <small>/ ${a.max_score}</small></p>`:''}<div class="actions">${a.submitted?`<button class="ghost" data-result="${a.attempt_id}">${a.released?'عرض النتيجة':'حالة التسليم'}</button>`:closed?'':`<button data-start="${a.id}">${a.attempt_id?'متابعة الاختبار':'بدء الاختبار'}</button>`}</div></article>`;}).join(''):empty('لا توجد اختبارات مكلّف بها حاليًا. يمكنك البدء بالتدريب.')}`;
  document.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{if(!confirm('يبدأ الوقت عند فتح الاختبار ويستمر حتى عند إغلاق الصفحة. هل أنت جاهز؟'))return;try{const t=await api('assignments/'+b.dataset.start+'/start','POST',{});await takeExam(t.id);}catch(e){notify(e.message);}});document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>takeExam(b.dataset.result));
}
async function takeExam(id){
  try{current=await api('attempts/'+id);revisions.set(id,current.revision);answers={...current.answers};}catch(e){notify(e.message);return;}
  if(current.submitted){showResult();return;}
  const offset=current.serverTime-Date.now();
  app.innerHTML=`<div class="exam-top"><div><h2>${esc(current.title)}</h2><span class="saved" id="saved">آخر إجاباتك المحفوظة جاهزة</span></div><span class="timer" id="timer"></span></div><p class="note">يحفظ كل تغيير تلقائيًا عند الاتصال. تحقق من رسالة الحفظ قبل إغلاق الصفحة. ينتهي الاختبار بالوقت المحدد من الخادم.</p><div id="answerForm">${current.questions.map((q,i)=>`<section class="card question"><div class="row between"><h3>السؤال ${i+1}</h3><span class="badge">${q.points} درجة</span></div><p>${esc(q.stem).replace(/\n/g,'<br>')}</p>${q.type==='mcq'?q.options.map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}" data-answer="${i}" ${answers[i]===k?'checked':''}>${esc(o)}</label>`).join(''):`<label for="answer${i}">إجابتك</label><textarea id="answer${i}" data-answer="${i}" maxlength="10000">${esc(answers[i]||'')}</textarea>`}</section>`).join('')}</div><div class="actions"><button id="submitExam">تسليم الاختبار نهائيًا</button><button class="ghost" id="saveExam">حفظ الآن</button><button class="ghost" id="examBack">رجوع للاختبارات</button></div><p class="help">لا يمكن تعديل الإجابات بعد التسليم.</p>`;
  document.querySelectorAll('[data-answer]').forEach(el=>el.oninput=()=>{answers[el.dataset.answer]=el.type==='radio'?+el.value:el.value;$('#saved').textContent='جارٍ الحفظ…';scheduleSave();});
  const tick=()=>{const seconds=Math.max(0,Math.ceil((current.deadline-Date.now()-offset)/1000));$('#timer').textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds===0){clearInterval(timer);$('#answerForm').classList.add('loading');$('#saved').textContent='انتهى الوقت. جارٍ تأكيد حالة التسليم…';saveQueue.then(()=>takeExam(id)).catch(()=>notify('تعذر الاتصال. أعد فتح المحاولة عند عودة الاتصال؛ ينتهي الوقت على الخادم.'));}};
  timer=setInterval(tick,1000);tick();
  $('#saveExam').onclick=()=>queueSave();$('#examBack').onclick=async()=>{try{await queueSave();dashboard();}catch{}};
  $('#submitExam').onclick=async()=>{const missing=current.questions.length-Object.values(answers).filter(v=>v!==''&&v!=null).length;if(!confirm(`${missing?'هناك '+missing+' أسئلة دون إجابة. ':''}تسليم الاختبار نهائيًا؟`))return;$('#submitExam').disabled=true;try{await queueSave(true);clearInterval(timer);await takeExam(id);}catch(e){notify(e.message);if($('#submitExam'))$('#submitExam').disabled=false;}};
}
let saveDelay;
function scheduleSave(){clearTimeout(saveDelay);saveDelay=setTimeout(()=>queueSave(),800);}
function queueSave(submit=false){
  clearTimeout(saveDelay);
  const attemptId=current.id,snapshot=structuredClone(answers);
  const request=saveQueue.catch(()=>{}).then(async()=>{const r=await api('attempts/'+attemptId,'PUT',{answers:snapshot,submit,revision:revisions.get(attemptId)});revisions.set(attemptId,r.revision);return r;});
  saveQueue=request;
  request.then(()=>{if($('#saved'))$('#saved').textContent='تم الحفظ · '+new Date().toLocaleTimeString('ar-SA');}).catch(e=>{if($('#saved'))$('#saved').textContent='لم يتم الحفظ: '+e.message;});
  return request;
}
function showResult(){
  clearInterval(timer);app.innerHTML=`<div class="intro"><div class="eyebrow">مِران / تسليم الاختبار</div><h1>${current.released?'خطوة أنجزتها.':'تم تسليم اختبارك.'}</h1><p>${esc(current.title)} · ${date(current.submitted)}</p></div><section class="card">${current.released?`<p class="score">${current.score} / ${current.maxScore}</p><p>${esc(current.feedback)}</p>`:'<h2>إجاباتك محفوظة لدى المعلم.</h2><p class="muted">ستظهر درجتك والملاحظات هنا عندما ينشر المعلم النتيجة.</p>'}<button class="ghost" id="resultBack">العودة لاختباراتي</button></section>${current.released?current.questions.map((q,i)=>`<section class="card"><h3>السؤال ${i+1} · ${q.points} درجة</h3><p>${esc(q.stem)}</p><p>إجابتك: ${esc(q.type==='mcq'?(q.options[current.answers[i]]||'دون إجابة'):(current.answers[i]||'دون إجابة'))}</p>${q.type==='mcq'?`<p>الإجابة الصحيحة: ${esc(q.options[q.correct])}</p>`:`<p>الدرجة: ${current.review[i]} / ${q.points}</p>`}</section>`).join(''):''}`;$('#resultBack').onclick=dashboard;
}
async function review(id){
  let t;try{t=await api('attempts/'+id);}catch(e){notify(e.message);return;}
  app.innerHTML=`<div class="intro"><div class="eyebrow">مِران / تصحيح</div><h1>${esc(t.title)}</h1><p>${t.released?'النتيجة منشورة. اسحب نشرها من سجل الدرجات لتعديل التصحيح.':'راجع الإجابات المكتوبة واحفظ درجاتها قبل النشر.'}</p></div><form id="reviewForm">${t.questions.map((q,i)=>`<section class="card"><h3>السؤال ${i+1} · ${q.points} درجة</h3><p>${esc(q.stem)}</p><p>إجابة الطالب: ${esc(q.type==='mcq'?(q.options[t.answers[i]]||'دون إجابة'):(t.answers[i]||'دون إجابة'))}</p>${q.type==='mcq'?`<p>الإجابة الصحيحة: ${esc(q.options[q.correct])} · الدرجة: ${t.answers[i]===q.correct?q.points:0}</p>`:`<label for="grade${i}">الدرجة (من ${q.points})</label><input id="grade${i}" name="grade${i}" type="number" min="0" max="${q.points}" step="0.5" value="${t.review[i]??''}" ${t.released?'disabled':''} required>`}</section>`).join('')}<div class="card"><label for="feedback">ملاحظات للطالب</label><textarea id="feedback" name="feedback" maxlength="4000" ${t.released?'disabled':''}>${esc(t.feedback)}</textarea></div><p class="error"></p><div class="actions">${!t.released?'<button type="submit">حفظ التصحيح</button>':''}<button type="button" class="ghost" id="reviewBack">رجوع</button></div></form>`;
  $('#reviewBack').onclick=dashboard;
  if(!t.released)wireForm('#reviewForm',async b=>{const review={};t.questions.forEach((q,i)=>{if(q.type==='written')review[i]=+b['grade'+i];});await api('review','POST',{attemptId:id,review,feedback:b.feedback});notify('تم حفظ التصحيح. يمكنك نشر النتيجة من سجل الدرجات');tab='grades';dashboard();});
}
function exportGrades(){
  const cell=value=>{let s=String(value??'');if(/^[=+\-@\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const rows=[['الاسم','اسم المستخدم','الاختبار','الدرجة','الدرجة الكاملة','حالة التسليم','النتيجة'],...grades.map(g=>[g.name,g.username,g.title,g.score,g.max_score,g.submitted?'تم التسليم':'لم يسلم',g.released?'منشورة':'محجوبة'])];
  const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='miran-grades.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
window.addEventListener('beforeunload',e=>{if(current&&!current.submitted){e.preventDefault();e.returnValue='';}});
(async()=>{try{const status=await api('status');if(status.needsSetup){auth(true);return;}try{const me=await api('me');user=me.user;csrf=me.csrf;identity();if(user.mustChange)passwordForm(true);else await dashboard();}catch{auth();}}catch{app.innerHTML='<section class="card"><h1>تعذر الاتصال بخادم مِران</h1><p>هذه البوابة تحتاج خادمًا لحماية الحسابات والدرجات. شغّل المشروع من الخادم، ثم أعد تحميل الصفحة.</p></section>';}})();
</script></head><body><header class="top"><a class="brand" href="./portal.html">مِران<span>بوابة الاختبارات</span></a><div id="identity"></div></header><main id="app" aria-live="polite"><p class="muted">جارٍ فتح مِران…</p></main><div id="notice" role="status"></div><footer>مِران القدرات <span>خطوة واضحة، وتقدّم يستحق أن تراه.</span></footer></body></html>
